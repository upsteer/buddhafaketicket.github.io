<!DOCTYPE html>
<html>
  <head>
    <title>Buddha Air Ticket</title>
    <style>
      @font-face {
        font-family: myFirstFont;
        src: url(prima_sans.otf);
      }

      @font-face {
        font-family: mySecondFont;
        src: url(prima_sans_bold.otf);
      }

      body {
        margin: 0;
        padding: 0;
      }

      .ticket-container {
        position: relative;
        width: 800px;
        margin: 20px auto;
      }

      .ticket-image {
        width: 100%;
        display: block;
      }

      .ticket-table {
        border: 1px red;
        width: 100%;
      }

      .first-line-table {
        position: absolute;
        top: 257px;
        left: 71px;
        width: 550px;
        border-collapse: collapse;
        table-layout: fixed;
      }

      .first-line-passenger-col {
        width: 150px;
      }

      .first-line-pnr-col {
        width: 72px;
      }

      .first-line-pnr-ticket-gap {
        width: 55px;
      }

      .first-line-ticket-col {
        width: 150px;
      }

      .first-line-nationality-col {
        width: 112px;
      }

      .first-line-text {
        font-size: 10px;
        color: #000;
        white-space: nowrap;
        overflow: hidden;
        line-height: 1.8em;
        text-align: center;
        height: 21px;
      }

      .second-line-table {
        position: absolute;
        top: 311px;
        left: 69px;
        width: 432px;
        border-collapse: collapse;
        table-layout: fixed;
      }

      .second-line-flt-no-col {
        width: 59px;
      }

      .second-line-flt-date-col {
        width: 95px;
      }

      .second-line-dep-time-col {
        width: 73px;
      }

      .second-line-from-col {
        width: 99px;
      }

      .second-line-to-col {
        width: 100px;
      }

      .second-line-status-gap{
        width: 56px;
      }

      .second-line-class-col{
        width: 52px;
      }

      .second-line-text {
        font-size: 10px;
        color: #000;
        white-space: nowrap;
        overflow: hidden;
        font-family: mySecondFont;
        line-height: 1.8em;
        text-align: center;
        height: 20px;
      }

      .overlay-text {
        position: absolute;
        font-size: 10px;
        color: #000;
        white-space: nowrap;
        overflow: hidden;
      }

      .bold-field {
        font-weight: 100;
      }

      .text-font-normal {
        font-family: myFirstFont;
      }

      .first-line-bold-text {
        font-family: mySecondFont;
      }

      .text-center-third-line,
      #total-airfare {
        text-align: center;
        line-height: 1.8em;
      }

      .text-center-third-line {
        font-family: myFirstFont;
        top: 366px;
        height: 20px;
      }

      #issue-date {
        left: 66px;
        width: 144px;
      }

      #total-airfare {
        top: 476px;
        left: 65px;
        width: 670px;
        height: 20px;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div class="ticket-container">
      <img
        src="./buddha_fake_1.jpg"
        alt="Buddha Air Ticket"
        class="ticket-image"
      />

      <table class="first-line-table">
        <tr>
          <td class="first-line-passenger-col">
            <div
              id="passenger-name-container"
              class="first-line-text bold-field first-line-bold-text"
            >
              JOHN DOE
            </div>
          </td>
          <td class="first-line-pnr-col">
            <div id="pnr-no-container" class="first-line-text text-font-normal">
              ABCDEF
            </div>
          </td>
          <td class="first-line-pnr-ticket-gap"></td>
          <td class="first-line-ticket-col">
            <div
              id="ticket-number-container"
              class="first-line-text bold-field first-line-bold-text"
            >
              30000000
            </div>
          </td>
          <td class="first-line-nationality-col">
            <div id="passenger-nationality" class="first-line-text text-font-normal">
              NEPAL
            </div>
          </td>
        </tr>
      </table>

      <table class="second-line-table">
        <tr>
          <td class="second-line-flt-no-col">
            <div id="flt-no" class="second-line-text bold-field">U4 000</div>
          </td>
          <td class="second-line-flt-date-col">
            <div id="flt-date" class="second-line-text bold-field">
              01-JAN-2027
            </div>
          </td>
          <td class="second-line-dep-time-col">
            <div id="dep-time" class="second-line-text bold-field">10:00</div>
          </td>
          <td class="second-line-from-col">
            <div id="from" class="second-line-text bold-field">KATHMANDU</div>
          </td>
          <td class="second-line-to-col">
            <div id="to" class="second-line-text bold-field">POKHARA</div>
          </td>
          <td class="second-line-status-gap"></td>
          <td class="second-line-class-col">
            <div id="class" class="second-line-text bold-field">E</div>
          </td>
        </tr>
      </table>

      <table class="ticket-table">
        <tr>
          <td colspan="3">
            <div id="issue-date" class="overlay-text text-center-third-line">
              01-Jan-2027
            </div>
          </td>
        </tr>
        <tr>
          <td colspan="3">
            <div id="total-airfare" class="overlay-text text-font-normal">
              NPR 9000.00
            </div>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
